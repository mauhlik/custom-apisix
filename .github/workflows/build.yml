name: Build
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
      COMPONENT_NAME: apisix
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=$(grep -oP '(?<=^ARG BASE_IMAGE=apache/apisix:)[0-9]+\.[0-9]+\.[0-9]+' Dockerfile)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}
          tags: |
            type=semver,event=tag,pattern={{version}},value=${{ steps.tag.outputs.version }}
            type=semver,event=tag,pattern=v{{version}},value=${{ steps.tag.outputs.version }}
            type=semver,event=tag,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,event=tag,pattern=v{{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,event=tag,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=semver,event=tag,pattern=v{{major}},value=${{ steps.tag.outputs.version }}
            type=sha

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
